apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab2-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab2
  template:
    metadata:
      labels:
        app: devops-lab2
    spec:
      containers:
        - name: devops-lab2-container
          image: devops-lab2-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
